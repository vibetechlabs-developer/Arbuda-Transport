{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Loan</title>{% endblock %}
{% block content %}
<div class="container-xxl"><h4 class="fw-bold py-3">Truck Loan</h4>
<div class="card"><div class="card-body"><form method="post" class="row">{% csrf_token %}
  <div class="mb-3 col-sm-6"><label class="form-label">Truck *</label><select class="form-select" name="truck" required><option value="">Select</option>{% for t in tm_trucks %}<option value="{{ t.id }}" {% if obj.truck_id == t.id %}selected{% endif %}>{{ t.registration_no }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Finance Company *</label><input class="form-control" name="finance_company" value="{{ obj.finance_company }}" required></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Loan Amount</label><input type="number" step="0.01" class="form-control" name="loan_amount" value="{{ obj.loan_amount }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Start Date</label><input type="date" class="form-control" name="start_date" value="{{ obj.start_date|date:'Y-m-d' }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">EMI Amount</label><input type="number" step="0.01" class="form-control" name="emi_amount" value="{{ obj.emi_amount }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">EMI Due Day</label><input type="number" class="form-control" name="emi_due_day" value="{{ obj.emi_due_day|default:5 }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Tenure (months)</label><input type="number" class="form-control" name="tenure_months" value="{{ obj.tenure_months }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Paid EMI count</label><input type="number" class="form-control" name="paid_emi_count" value="{{ obj.paid_emi_count }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Outstanding</label><input type="number" step="0.01" class="form-control" name="outstanding" value="{{ obj.outstanding }}"></div>
  <div class="mb-3 col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes">{{ obj.notes }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-loan-list' %}">Back</a></div>
</form></div></div></div>
{% endblock %}
