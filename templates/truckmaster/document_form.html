{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Document</title>{% endblock %}
{% block content %}
<div class="container-xxl"><h4 class="fw-bold py-3">Insurance & Documents</h4>
<div class="card"><div class="card-body"><form method="post" enctype="multipart/form-data" class="row">{% csrf_token %}
  <div class="mb-3 col-sm-6"><label class="form-label">Truck *</label><select class="form-select" name="truck" required><option value="">Select</option>{% for t in tm_trucks %}<option value="{{ t.id }}" {% if obj.truck_id == t.id %}selected{% endif %}>{{ t.registration_no }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Document Type</label><select class="form-select" name="doc_type">{% for c,l in obj.DOC_TYPES %}<option value="{{ c }}" {% if obj.doc_type == c %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Policy / Number</label><input class="form-control" name="policy_no" value="{{ obj.policy_no }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Provider</label><input class="form-control" name="provider" value="{{ obj.provider }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Premium</label><input type="number" step="0.01" class="form-control" name="premium_amount" value="{{ obj.premium_amount }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Start Date</label><input type="date" class="form-control" name="start_date" value="{{ obj.start_date|date:'Y-m-d' }}"></div>
  <div class="mb-3 col-sm-4"><label class="form-label">Expiry Date</label><input type="date" class="form-control" name="expiry_date" data-allow-future="true" value="{{ obj.expiry_date|date:'Y-m-d' }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Attachment</label><input type="file" class="form-control" name="attachment"></div>
  <div class="mb-3 col-12"><label class="form-label">Remarks</label><input class="form-control" name="remarks" value="{{ obj.remarks }}"></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-document-list' %}">Back</a></div>
</form></div></div></div>
{% endblock %}
