{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Toll</title>{% endblock %}
{% block content %}
<div class="container-xxl"><h4 class="fw-bold py-3">Toll / FASTag Entry</h4>
<div class="card"><div class="card-body"><form method="post" class="row">{% csrf_token %}
  <div class="mb-3 col-sm-6"><label class="form-label">Truck *</label><select class="form-select" name="truck" required><option value="">Select</option>{% for t in tm_trucks %}<option value="{{ t.id }}" {% if obj.truck_id == t.id %}selected{% endif %}>{{ t.registration_no }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Trip</label><select class="form-select" name="trip"><option value="">--</option>{% for t in trips %}<option value="{{ t.id }}" {% if obj.trip_id == t.id %}selected{% endif %}>{{ t.trip_no }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Plaza *</label><input class="form-control" name="plaza_name" value="{{ obj.plaza_name }}" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Date & Time *</label><input type="datetime-local" class="form-control" name="entry_datetime" data-allow-future="true"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ obj.location }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-control" name="amount" value="{{ obj.amount }}" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">FASTag Txn ID</label><input class="form-control" name="fastag_txn_id" value="{{ obj.fastag_txn_id }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Payment Reference</label><input class="form-control" name="payment_reference" value="{{ obj.payment_reference }}"></div>
  <div class="mb-3 col-sm-6 form-check mt-4"><input class="form-check-input" type="checkbox" name="is_fastag" {% if obj.is_fastag or not obj.id %}checked{% endif %}><label class="form-check-label">FASTag transaction</label></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-toll-list' %}">Back</a></div>
</form></div></div></div>
{% endblock %}
