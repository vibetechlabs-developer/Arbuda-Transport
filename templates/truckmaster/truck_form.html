{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Truck Form</title>{% endblock %}
{% block content %}
<div class="container-xxl">
  <h4 class="fw-bold py-3">{{ obj.id|yesno:"Edit Truck,Add Truck" }}</h4>
  <div class="card"><div class="card-body">
    <form method="post" enctype="multipart/form-data" class="row">{% csrf_token %}
      <div class="mb-3 col-sm-6"><label class="form-label">Registration Number *</label><input class="form-control" name="registration_no" value="{{ obj.registration_no }}" required></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Name / Model</label><input class="form-control" name="name_model" value="{{ obj.name_model }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Vehicle Type</label><input class="form-control" name="vehicle_type" value="{{ obj.vehicle_type }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ obj.category }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Capacity (Ton)</label><input class="form-control" type="number" step="0.001" name="capacity_ton" value="{{ obj.capacity_ton }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Axles</label><input class="form-control" type="number" name="axles" value="{{ obj.axles }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Chassis Number</label><input class="form-control" name="chassis_no" value="{{ obj.chassis_no }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Engine Number</label><input class="form-control" name="engine_no" value="{{ obj.engine_no }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Fuel Type</label><select class="form-select" name="fuel_type">{% for c,l in obj.FUEL_CHOICES %}<option value="{{ c }}" {% if obj.fuel_type == c %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Purchase Date</label><input class="form-control" type="date" name="purchase_date" value="{{ obj.purchase_date|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Purchase Price</label><input class="form-control" type="number" step="0.01" name="purchase_price" value="{{ obj.purchase_price }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Ownership</label><select class="form-select" name="ownership_type">{% for c,l in obj.OWNERSHIP_CHOICES %}<option value="{{ c }}" {% if obj.ownership_type == c %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Insurance Provider</label><input class="form-control" name="insurance_provider" value="{{ obj.insurance_provider }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Policy Number</label><input class="form-control" name="insurance_policy_no" value="{{ obj.insurance_policy_no }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Insurance Expiry</label><input class="form-control" type="date" name="insurance_expiry" data-allow-future="true" value="{{ obj.insurance_expiry|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Fitness Expiry</label><input class="form-control" type="date" name="fitness_expiry" data-allow-future="true" value="{{ obj.fitness_expiry|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">PUC Expiry</label><input class="form-control" type="date" name="puc_expiry" data-allow-future="true" value="{{ obj.puc_expiry|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Permit Expiry</label><input class="form-control" type="date" name="permit_expiry" data-allow-future="true" value="{{ obj.permit_expiry|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">RC Number</label><input class="form-control" name="rc_number" value="{{ obj.rc_number }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Odometer</label><input class="form-control" type="number" name="odometer" value="{{ obj.odometer }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Assigned Driver</label><select class="form-select" name="assigned_driver"><option value="">--</option>{% for d in drivers %}<option value="{{ d.id }}" {% if obj.assigned_driver_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Status</label><select class="form-select" name="status">{% for c,l in obj.STATUS_CHOICES %}<option value="{{ c }}" {% if obj.status == c %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-3 col-sm-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes">{{ obj.notes }}</textarea></div>
      <div class="mb-3 col-sm-6"><label class="form-label">RC / Documents</label><input class="form-control" type="file" name="rc_attachment"></div>
      <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-truck-list' %}">Back</a></div>
    </form>
  </div></div>
</div>
{% endblock %}
