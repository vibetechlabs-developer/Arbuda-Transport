{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Party</title>{% endblock %}
{% block content %}
<div class="container-xxl"><h4 class="fw-bold py-3">Party / Customer</h4>
<div class="card"><div class="card-body"><form method="post" class="row">{% csrf_token %}
  <div class="mb-3 col-sm-6"><label class="form-label">Name *</label><input class="form-control" name="name" value="{{ obj.name }}" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Contact</label><input class="form-control" name="contact_number" value="{{ obj.contact_number }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">GSTIN</label><input class="form-control" name="gstin" value="{{ obj.gstin }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Linked Contract</label><select class="form-select" name="contract"><option value="">--</option>{% for c in contracts %}<option value="{{ c.id }}" {% if obj.contract_id == c.id %}selected{% endif %}>{{ c.contract_no }} - {{ c.company_name }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ obj.city }}"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">State</label><input class="form-control" name="state" value="{{ obj.state }}"></div>
  <div class="mb-3 col-12"><label class="form-label">Address</label><textarea class="form-control" name="address">{{ obj.address }}</textarea></div>
  <div class="mb-3 col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes">{{ obj.notes }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-party-list' %}">Back</a></div>
</form></div></div></div>
{% endblock %}
