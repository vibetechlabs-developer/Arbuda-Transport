{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Advance</title>{% endblock %}
{% block content %}
<div class="container-xxl"><h4 class="fw-bold py-3">Driver Advance</h4>
<div class="card"><div class="card-body"><form method="post" class="row">{% csrf_token %}
  <div class="mb-3 col-sm-6"><label class="form-label">Driver *</label><select class="form-select" name="driver" required><option value="">Select</option>{% for d in tm_drivers %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Date *</label><input type="date" class="form-control" name="entry_date" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-control" name="amount" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Payment Mode</label><select class="form-select" name="payment_mode"><option value="cash">Cash</option><option value="bank">Bank</option><option value="upi">UPI</option></select></div>
  <div class="mb-3 col-12"><label class="form-label">Remarks</label><input class="form-control" name="remarks"></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-salary-list' %}">Back</a></div>
</form></div></div></div>
{% endblock %}
