{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | Booking</title>{% endblock %}
{% block content %}
<div class="container-xxl">
  <h4 class="fw-bold py-3">{{ obj.id|yesno:"Edit Booking,Create Booking" }}</h4>
  <div class="card"><div class="card-body">
    <form method="post" enctype="multipart/form-data" class="row" id="bookingForm">{% csrf_token %}
      <div class="mb-3 col-sm-6"><label class="form-label">Booking Date *</label><input type="date" class="form-control" name="booking_date" value="{{ obj.booking_date|date:'Y-m-d' }}" required></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Party *</label>
        <select class="form-select" name="party" required>
          <option value="">Select party</option>
          {% for p in tm_parties %}<option value="{{ p.id }}" {% if obj.party_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="mb-3 col-sm-6"><label class="form-label">Contact Number</label><input class="form-control" name="contact_number" value="{{ obj.contact_number }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Source *</label><input class="form-control" name="source_location" value="{{ obj.source_location }}" required></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Destination *</label><input class="form-control" name="destination" value="{{ obj.destination }}" required></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Loading Point</label><input class="form-control" name="loading_point" value="{{ obj.loading_point }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Unloading Point</label><input class="form-control" name="unloading_point" value="{{ obj.unloading_point }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Material</label><input class="form-control" name="material_description" value="{{ obj.material_description }}"></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Material Category</label><input class="form-control" name="material_category" value="{{ obj.material_category }}"></div>
      <div class="mb-3 col-sm-4"><label class="form-label">Weight</label><input type="number" step="0.001" class="form-control" name="total_weight" id="total_weight" value="{{ obj.total_weight }}"></div>
      <div class="mb-3 col-sm-2"><label class="form-label">Unit</label><input class="form-control" name="weight_unit" value="{{ obj.weight_unit|default:'MT' }}"></div>
      <div class="mb-3 col-sm-3"><label class="form-label">Rate Type</label>
        <select class="form-select" name="rate_type" id="rate_type">{% for c,l in obj.RATE_TYPE_CHOICES %}<option value="{{ c }}" {% if obj.rate_type == c %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
      </div>
      <div class="mb-3 col-sm-3"><label class="form-label">Freight Rate</label><input type="number" step="0.01" class="form-control" name="freight_rate" id="freight_rate" value="{{ obj.freight_rate }}"></div>
      <div class="mb-3 col-sm-3"><label class="form-label">KM (if per KM)</label><input type="number" class="form-control" name="km" id="km" value="0"></div>
      <div class="mb-3 col-sm-3"><label class="form-label">Total Freight</label><input class="form-control" id="total_freight_display" value="{{ obj.total_freight }}" readonly></div>
      <div class="mb-3 col-sm-4"><label class="form-label">Advance</label><input type="number" step="0.01" class="form-control" name="advance_amount" value="{{ obj.advance_amount }}"></div>
      <div class="mb-3 col-sm-4"><label class="form-label">Payment Mode</label>
        <select class="form-select" name="payment_mode">{% for c,l in obj.PAYMENT_MODES %}<option value="{{ c }}" {% if obj.payment_mode == c %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
      </div>
      <div class="mb-3 col-sm-4"><label class="form-label">Expected Loading</label><input type="date" class="form-control" name="expected_loading_date" data-allow-future="true" value="{{ obj.expected_loading_date|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-4"><label class="form-label">Expected Delivery</label><input type="date" class="form-control" name="expected_delivery_date" data-allow-future="true" value="{{ obj.expected_delivery_date|date:'Y-m-d' }}"></div>
      <div class="mb-3 col-sm-4"><label class="form-label">Truck</label>
        <select class="form-select" name="truck"><option value="">Select</option>{% for t in tm_trucks %}<option value="{{ t.id }}" {% if obj.truck_id == t.id %}selected{% endif %}>{{ t.registration_no }} ({{ t.status }})</option>{% endfor %}</select>
      </div>
      <div class="mb-3 col-sm-4"><label class="form-label">Driver</label>
        <select class="form-select" name="driver"><option value="">Select</option>{% for d in tm_drivers %}<option value="{{ d.id }}" {% if obj.driver_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
      </div>
      <div class="mb-3 col-12"><label class="form-label">Remarks</label><textarea class="form-control" name="remarks">{{ obj.remarks }}</textarea></div>
      <div class="mb-3 col-sm-6"><label class="form-label">Attachment</label><input type="file" class="form-control" name="attachment"></div>
      <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-booking-list' %}">Back</a></div>
    </form>
  </div></div>
</div>
<script>
function calcFreight(){
  const p = new URLSearchParams({rate_type: document.getElementById('rate_type').value, rate: document.getElementById('freight_rate').value || 0, weight: document.getElementById('total_weight').value || 0, km: document.getElementById('km').value || 0});
  fetch('/api/truck-master/freight?' + p.toString()).then(r=>r.json()).then(d=>{ document.getElementById('total_freight_display').value = d.total_freight; });
}
['rate_type','freight_rate','total_weight','km'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('change', calcFreight); });
</script>
{% endblock %}
