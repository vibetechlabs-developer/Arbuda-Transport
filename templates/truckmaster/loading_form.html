{% extends 'masterpage.html' %}
{% block title %}<title>ARBUDA | {{ kind|title }} Entry</title>{% endblock %}
{% block content %}
<div class="container-xxl"><h4 class="fw-bold py-3">{{ kind|title }} Entry</h4>
<div class="card"><div class="card-body"><form method="post" class="row">{% csrf_token %}
  <input type="hidden" name="kind" value="{{ kind }}">
  <div class="mb-3 col-sm-6"><label class="form-label">Trip *</label><select class="form-select" name="trip" required><option value="">Select trip</option>{% for t in trips %}<option value="{{ t.id }}">{{ t.trip_no }} - {{ t.truck.registration_no }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Date *</label><input type="date" class="form-control" name="entry_date" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Location *</label><input class="form-control" name="location" required></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Material</label><input class="form-control" name="material"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Party</label><select class="form-select" name="party"><option value="">--</option>{% for p in tm_parties %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Weight</label><input type="number" step="0.001" class="form-control" name="weight"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">Labour Charges</label><input type="number" step="0.01" class="form-control" name="labour_charges"></div>
  <div class="mb-3 col-sm-6"><label class="form-label">{{ kind|title }} Charges</label><input type="number" step="0.01" class="form-control" name="charges"></div>
  <div class="mb-3 col-12"><label class="form-label">Remarks</label><textarea class="form-control" name="remarks"></textarea></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'tm-loading-list' %}">Back</a></div>
</form></div></div></div>
{% endblock %}
